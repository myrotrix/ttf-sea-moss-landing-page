name: Bootstrap approved TTF landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved V3.31 source
        run: |
          curl -L --fail --retry 3 "https://drive.usercontent.google.com/download?id=1_yVuKpHeFZ6zpIQLqM9bAisDCH6HqVKl&export=download&confirm=t" -o index.html
      - name: Commit approved landing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add approved TTF landing page V3.31"
            git push
          fi
