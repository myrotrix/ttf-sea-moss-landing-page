name: Bootstrap approved TTF landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact approved V3.31 source
        run: |
          cat .bootstrap/v331_0.b64 .bootstrap/v331_1a.b64 .bootstrap/v331_1.b64 .bootstrap/v331_3.b64 > /tmp/v331.b64
          base64 -d /tmp/v331.b64 > /tmp/v331.html.gz
          gzip -dc /tmp/v331.html.gz > index.html
          echo "6051ad79c66d23fcb7fbb1da1582035fda9a94c01623232426efff67136e153e  index.html" | sha256sum -c -
      - name: Commit approved landing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore exact approved TTF landing page V3.31"
            git push
          fi
