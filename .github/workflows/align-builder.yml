name: Align builder to page container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align builder to hero width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* MT V3.32 — ALIGN DUAL BUILDER TO HERO WIDTH */'
          if marker not in s:
              css='''\n<style>\n/* MT V3.32 — ALIGN DUAL BUILDER TO HERO WIDTH */\n@media (min-width:821px){\n  .ttf-dual-builder{\n    width:min(1180px,calc(100% - 28px))!important;\n    max-width:1180px!important;\n    margin:18px auto 22px!important;\n    padding:14px 16px!important;\n    border-radius:24px!important;\n  }\n  .ttf-db-grid{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important;}\n}\n@media (max-width:820px){\n  .ttf-dual-builder{width:calc(100% - 16px)!important;max-width:none!important;margin:10px 8px 14px!important;}\n}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s)
          PY
      - name: Commit aligned builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Align dual builder to hero content width"
            git push
          fi
